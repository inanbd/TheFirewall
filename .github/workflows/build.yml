name: Build

on:
  push:
    branches: [ main, master, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Publish a GitHub release with this version, e.g. 1.0.0 (creates tag v1.0.0). Leave empty for a normal build.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          # MSI versions must be numeric, so a tag like v1.2.0-rc.1 builds version 1.2.0.
          $requested = "${{ inputs.release_version }}".Trim().TrimStart('v')
          $version = if ($requested) { ($requested -split '-')[0] }
                     elseif ("${{ github.ref_type }}" -eq "tag") { ("${{ github.ref_name }}".TrimStart('v') -split '-')[0] }
                     else { "1.0.${{ github.run_number }}" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build TheFirewall.slnx -c Release

      - name: Test
        run: dotnet test tests/TheFirewall.Core.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish (self-contained)
        shell: pwsh
        run: ./build/publish.ps1 -Version ${{ steps.version.outputs.value }} -SkipInstaller

      - name: UI smoke test (renders every page with demo data)
        shell: pwsh
        run: |
          $out = Join-Path $pwd "artifacts/screenshots"
          $p = Start-Process -FilePath artifacts/publish/win-x64/TheFirewall.exe -ArgumentList @('--screenshots', "`"$out`"") -PassThru
          $finished = $p.WaitForExit(180000)
          if (-not $finished) { $p.Kill() }
          $log = Join-Path $env:LOCALAPPDATA "TheFirewall/app-errors.log"
          if (Test-Path $log) { Get-Content $log }
          if (-not $finished) { throw "The app did not finish rendering within 3 minutes." }
          if (Test-Path $out) { Get-ChildItem $out | Format-Table Name, Length }
          if ($p.ExitCode -ne 0) { throw "UI smoke test failed with exit code $($p.ExitCode)" }
          if ((Get-ChildItem $out -Filter *.png).Count -lt 10) { throw "Expected at least 10 screenshots." }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/screenshots
          if-no-files-found: ignore

      - name: Service command line check
        shell: pwsh
        run: |
          & artifacts/publish/win-x64/TheFirewall.Service.exe help
          if ($LASTEXITCODE -ne 0) { throw "TheFirewall.Service.exe help failed ($LASTEXITCODE)" }

      - name: End-to-end test (app starts the service, attackers get banned in Windows Firewall)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = (Resolve-Path artifacts/publish/win-x64).Path
          $app = Join-Path $dir 'TheFirewall.exe'
          $svc = Join-Path $dir 'TheFirewall.Service.exe'

          function Invoke-EnsureService([string]$label) {
            $out = Join-Path $env:RUNNER_TEMP "ensure-$label.txt"
            $p = Start-Process $app -ArgumentList '--ensure-service' -PassThru -RedirectStandardOutput $out
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "--ensure-service ($label) timed out" }
            Write-Host "--ensure-service ($label): $((Get-Content $out -Raw)) (exit code $($p.ExitCode))"
            if ($p.ExitCode -ne 0) { throw "--ensure-service ($label) failed with exit code $($p.ExitCode)" }
            $status = (Get-Service TheFirewall).Status
            if ($status -ne 'Running') { throw "Service is $status after --ensure-service ($label)" }
          }

          function Get-BannedAddresses {
            @(Get-NetFirewallRule -DisplayName 'TheFirewall_Ban_*' -ErrorAction SilentlyContinue |
              Get-NetFirewallAddressFilter | ForEach-Object { $_.RemoteAddress })
          }

          try {
            if (Get-Service TheFirewall -ErrorAction SilentlyContinue) { throw 'The service is unexpectedly installed already.' }

            Write-Host '1. The service is not installed: the app installs and starts it.'
            Invoke-EnsureService 'install'

            Write-Host '2. The service is stopped: the app starts it again.'
            Stop-Service TheFirewall
            (Get-Service TheFirewall).WaitForStatus('Stopped', [TimeSpan]::FromSeconds(30))
            Invoke-EnsureService 'start'

            Write-Host '2b. Through the service pipe an elevated administrator may change settings; a standard user is read-only.'
            $adminOut = Join-Path $env:RUNNER_TEMP 'check-admin.txt'
            $p = Start-Process $svc -ArgumentList 'check' -PassThru -Wait -NoNewWindow -RedirectStandardOutput $adminOut
            Get-Content $adminOut | Write-Host
            if ($p.ExitCode -ne 0) { throw "The administrator was not allowed to change settings (exit code $($p.ExitCode))." }

            $copy = Join-Path $env:PUBLIC 'TheFirewallCheck'
            Copy-Item $dir $copy -Recurse -Force
            $password = 'Tf!' + [guid]::NewGuid().ToString('N').Substring(0, 16) + 'aA1'
            $secure = ConvertTo-SecureString $password -AsPlainText -Force
            New-LocalUser -Name 'tfcheck' -Password $secure -AccountNeverExpires | Out-Null
            $cred = [PSCredential]::new("$env:COMPUTERNAME\tfcheck", $secure)
            $userOut = Join-Path $env:PUBLIC 'check-user.txt'
            $p = Start-Process (Join-Path $copy 'TheFirewall.Service.exe') -ArgumentList 'check' -Credential $cred -PassThru -Wait `
                   -WorkingDirectory $copy -RedirectStandardOutput $userOut
            Get-Content $userOut | Write-Host
            if ($p.ExitCode -ne 4) { throw "A standard user should get read-only access (exit code $($p.ExitCode))." }

            Write-Host '3. Failed logins are detected and the attackers are banned.'
            Start-Sleep -Seconds 15   # let the log monitors finish their first scan
            $logDir = Join-Path $env:ProgramData 'TheFirewall\CustomLogs'
            New-Item -ItemType Directory -Force $logDir | Out-Null
            $now = [DateTime]::UtcNow
            $lines = 0..5 | ForEach-Object {
              '{0:yyyy-MM-ddTHH:mm:ssZ}, thefirewall failed login, ip address: 203.0.113.50, source: CiFileTest, user: admin' -f $now.AddSeconds(-60 + $_ * 3)
            }
            Set-Content -Path (Join-Path $logDir 'ci-test.log') -Value $lines -Encoding utf8
            for ($i = 0; $i -lt 6; $i++) {
              eventcreate /L APPLICATION /T WARNING /SO TheFirewallCI /ID 100 /D "thefirewall failed login, ip address: 203.0.113.60, source: CiEventTest, user: admin" | Out-Null
              Start-Sleep -Milliseconds 1300
            }

            $deadline = (Get-Date).AddSeconds(120)
            do {
              Start-Sleep -Seconds 3
              $banned = Get-BannedAddresses
              $fileBanned = [bool]($banned | Where-Object { $_ -like '203.0.113.50*' })
              $eventBanned = [bool]($banned | Where-Object { $_ -like '203.0.113.60*' })
            } until (($fileBanned -and $eventBanned) -or (Get-Date) -gt $deadline)
            Write-Host "Banned addresses in Windows Firewall: $($banned -join ', ')"
            Get-NetFirewallRule -DisplayName 'TheFirewall_*' | Format-Table DisplayName, Enabled, Direction, Action -AutoSize | Out-String | Write-Host
            if (-not $fileBanned) { throw 'The attacker from the custom log file was not banned.' }
            if (-not $eventBanned) { throw 'The attacker from the Application event log was not banned.' }

            Write-Host '3b. A real failed Windows logon (event 4625) is a failure, never a sign-in.'
            for ($i = 0; $i -lt 3; $i++) {
              cmd /c 'net use \\127.0.0.1\IPC$ /user:tfbaduser Wr0ng-Passw0rd-123 >nul 2>&1'
              Start-Sleep -Milliseconds 1500
            }
            Start-Sleep -Seconds 5
            $activity = & $svc activity 200 | Out-String
            $mine = @($activity -split "`r?`n" | Where-Object { $_ -match 'tfbaduser' })
            $mine | ForEach-Object { Write-Host $_ }
            if (-not ($mine | Where-Object { $_ -match 'FailedLogin|Ignored' })) { Write-Host $activity; throw 'The failed Windows logon was not detected.' }
            if ($mine | Where-Object { $_ -match 'SuccessfulLogin' }) { throw 'A failed Windows logon was reported as a successful sign-in.' }

            Write-Host '3c. The service downloads and loads the country database (db-ip.com).'
            $deadline = (Get-Date).AddSeconds(150)
            do {
              $check = & $svc check | Out-String
              $geoReady = $check -match 'Country database: \d{4}-\d{2}'
              if (-not $geoReady) { Start-Sleep -Seconds 5 }
            } until ($geoReady -or (Get-Date) -gt $deadline)
            ($check -split "`r?`n" | Where-Object { $_ -match 'Country database' }) | ForEach-Object { Write-Host $_ }
            if (-not $geoReady) { throw 'The country database was not downloaded and loaded.' }

            Write-Host '4. Uninstalling removes the service and its firewall rules.'
            & $svc uninstall
            if ($LASTEXITCODE -ne 0) { throw "uninstall failed ($LASTEXITCODE)" }
            if (Get-Service TheFirewall -ErrorAction SilentlyContinue) { throw 'The service is still installed.' }
            if (Get-NetFirewallRule -DisplayName 'TheFirewall_*' -ErrorAction SilentlyContinue) { throw 'Firewall rules were left behind.' }

            Write-Host '5. A portable copy extracted from a downloaded zip (marked as coming from the internet) installs the service too.'
            $marked = @(Get-ChildItem $dir -File | Where-Object { $_.Extension -in '.exe', '.dll' })
            foreach ($f in $marked) {
              Set-Content -LiteralPath $f.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://github.com/"
            }
            try {
              # 1.0.3 and earlier started the tool through the Windows shell, which waits on a "downloaded file"
              # security prompt that nobody can see (a CI run hung here for an hour). The app now starts it directly.
              Invoke-EnsureService 'install-downloaded'
              & $svc uninstall
              if ($LASTEXITCODE -ne 0) { throw "uninstall failed ($LASTEXITCODE)" }
            }
            finally {
              $marked | Unblock-File
            }
            Write-Host 'End-to-end test passed.'
          }
          finally {
            Get-ChildItem (Join-Path $env:ProgramData 'TheFirewall\logs') -Filter 'service-*.log' -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "---- $($_.Name)"; Get-Content $_.FullName -Tail 80 }
            foreach ($name in 'app.log', 'app-errors.log') {
              $appLog = Join-Path $env:LOCALAPPDATA "TheFirewall\$name"
              if (Test-Path $appLog) { Write-Host "---- $name"; Get-Content $appLog -Tail 80 }
            }
          }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: TheFirewall-${{ steps.version.outputs.value }}-x64-portable
          path: artifacts/publish/win-x64

      - name: Build installer
        shell: pwsh
        run: ./build/publish.ps1 -Version ${{ steps.version.outputs.value }} -InstallerOnly

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TheFirewall-${{ steps.version.outputs.value }}-x64-msi
          path: artifacts/installer/*.msi

  # Publishes a GitHub release with the installer, a portable zip and checksums, either when a tag such as
  # v1.2.3 is pushed or when the workflow is run by hand with a release version (the tag is then created on the
  # built commit). Release notes are read from docs/releases/<tag>.md when present.
  release:
    needs: build
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: TheFirewall-*

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="v${REQUESTED_VERSION#v}"; fi
          version="${tag#v}"
          numeric="${version%%-*}"
          cd dist
          (cd "TheFirewall-${numeric}-x64-portable" && zip -qr "../TheFirewall-${version}-x64-portable.zip" .)
          cp "TheFirewall-${numeric}-x64-msi/"*.msi .
          sha256sum *.msi *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          notes="../docs/releases/${tag}.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          prerelease_args=()
          if [[ "$tag" == *-* ]]; then prerelease_args=(--prerelease); fi
          gh release create "$tag" *.msi *.zip SHA256SUMS.txt --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "TheFirewall ${version}" "${notes_args[@]}" "${prerelease_args[@]}"
